    .weather-card {

    .condition {
        font-size: 20px;
        margin: 5px 0 25px;

        color: #c4b5fd;
    }

    /* Information grid */

    .details {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .detail-box {

        /* Changed card color */
        background: rgba(255, 255, 255, 0.12);

        padding: 18px 10px;

        border-radius: 15px;

        /* Changed border */
        border: 1px solid rgba(255, 255, 255, 0.10);
    }

    .detail-icon {
        font-size: 25px;
        margin-bottom: 8px;
    }

    .detail-title {
        font-size: 13px;
        opacity: 0.8;

        /* Changed color */
        color: #ddd6fe;

        font-size: 18px;
        font-weight: bold;
        margin-top: 5px;

        /* Changed color */
        color: #ffffff;
    }

    /* Messages */

    .message {
        text-align: center;
        padding: 15px;
        display: none;
    }

    .error {

        /* Changed error colors */
        background: rgba(239, 68, 68, 0.20);

        border-radius: 10px;

        color: #fecaca;

        border: 1px solid rgba(248, 113, 113, 0.25);

    .loading {

        padding: 15px;

    @media (max-width: 450px) {

</style>

</div>

<script>

    /*
        Open-Meteo API

        We use two APIs:

        1. Geocoding API
           Converts city name → latitude + longitude

        2. Weather API
           Converts latitude + longitude → weather data
    */


    // --------------------------------
    // Weather condition information
    // --------------------------------

    function getWeatherInfo(code) {

        const weatherCodes = {

            0: {
                text: "Clear Sky",
                icon: "☀️"
            },

            1: {
                text: "Mainly Clear",
                icon: "🌤️"
            },

            2: {
                text: "Partly Cloudy",
                icon: "⛅"
            },

            3: {
                text: "Overcast",
                icon: "☁️"
            },

            45: {
                text: "Foggy",
                icon: "🌫️"
            },

            48: {
                text: "Foggy",
                icon: "🌫️"
            },

            51: {
                text: "Light Drizzle",
                icon: "🌦️"
            },

            53: {
                text: "Drizzle",
                icon: "🌦️"
            },

            55: {
                text: "Heavy Drizzle",
                icon: "🌧️"
            },

            61: {
                text: "Light Rain",
                icon: "🌧️"
            },

            63: {
                text: "Moderate Rain",
                icon: "🌧️"
            },

            65: {
                text: "Heavy Rain",
                icon: "🌧️"
            },

            71: {
                text: "Light Snow",
                icon: "🌨️"
            },

            73: {
                text: "Snow",
                icon: "❄️"
            },

            75: {
                text: "Heavy Snow",
                icon: "❄️"
            },

            80: {
                text: "Rain Showers",
                icon: "🌦️"
            },

            81: {
                text: "Rain Showers",
                icon: "🌧️"
            },

            82: {
                text: "Heavy Rain Showers",
                icon: "⛈️"
            },

            95: {
                text: "Thunderstorm",
                icon: "⛈️"
            },

            96: {
                text: "Thunderstorm with Hail",
                icon: "⛈️"
            },

            99: {
                text: "Heavy Thunderstorm",
                icon: "⛈️"
            }

        };

        return weatherCodes[code] || {
            text: "Unknown Weather",
            icon: "🌡️"
        };

    }


    // --------------------------------
    // Show / Hide Loading
    // --------------------------------

    function showLoading() {

        document.getElementById("loading").style.display =
            "block";

        document.getElementById("weatherCard").style.display =
            "none";

        document.getElementById("error").style.display =
            "none";

    }


    function hideLoading() {

        document.getElementById("loading").style.display =
            "none";

    }


    // --------------------------------
    // Show Error
    // --------------------------------

    function showError(message) {

        hideLoading();

        const error =
            document.getElementById("error");

        error.innerText = message;

        error.style.display =
            "block";

        document.getElementById("weatherCard").style.display =
            "none";

    }


    // --------------------------------
    // Get weather using coordinates
    // --------------------------------

    async function getWeather(
        latitude,
        longitude,
        locationName
    ) {

        showLoading();

        try {

            const url =
                `https://api.open-meteo.com/v1/forecast` +
                `?latitude=${latitude}` +
                `&longitude=${longitude}` +
                `&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,is_day` +
                `&timezone=auto`;

            const response =
                await fetch(url);

            if (!response.ok) {

                throw new Error(
                    "Weather API request failed"
                );

            }

            const data =
                await response.json();

            displayWeather(
                data,
                locationName
            );

        }

        catch (error) {

            console.error(error);

            showError(
                "Unable to fetch weather data. Please try again."
            );

        }

    }


    // --------------------------------
    // Display Weather
    // --------------------------------

    function displayWeather(
        data,
        locationName
    ) {

        hideLoading();

        document.getElementById("error").style.display =
            "none";

        const current =
            data.current;

        const weatherInfo =
            getWeatherInfo(
                current.weather_code
            );


        // Location

        document.getElementById("location").innerText =
            locationName;


        // Date

        const date =
            new Date();

        document.getElementById("date").innerText =
            date.toLocaleDateString(
                "en-IN",
                {
                    weekday: "long",
                    day: "numeric",
                    month: "long"
                }
            );


        // Icon

        document.getElementById("weatherIcon").innerText =
            weatherInfo.icon;


        // Temperature

        document.getElementById("temperature").innerText =
            Math.round(
                current.temperature_2m
            );


        // Weather condition

        document.getElementById("condition").innerText =
            weatherInfo.text;


        // Feels like

        document.getElementById("feelsLike").innerText =
            Math.round(
                current.apparent_temperature
            );


        // Humidity

        document.getElementById("humidity").innerText =
            current.relative_humidity_2m;


        // Wind

        document.getElementById("wind").innerText =
            Math.round(
                current.wind_speed_10m
            );


        // Rain

        document.getElementById("rain").innerText =
            current.precipitation;


        // Show weather card

        document.getElementById("weatherCard").style.display =
            "block";

    }


    // --------------------------------
    // Search City
    // --------------------------------

    async function searchWeather() {

        const city =
            document
                .getElementById("cityInput")
                .value
                .trim();


        if (!city) {

            showError(
                "Please enter a city name."
            );

            return;

        }


        showLoading();


        try {

            const url =
                `https://geocoding-api.open-meteo.com/v1/search` +
                `?name=${encodeURIComponent(city)}` +
                `&count=1` +
                `&language=en` +
                `&format=json`;


            const response =
                await fetch(url);


            if (!response.ok) {

                throw new Error(
                    "Location search failed"
                );

            }


            const data =
                await response.json();


            if (
                !data.results ||
                data.results.length === 0
            ) {

                showError(
                    "Location not found. Try another city."
                );

                return;

            }


            const location =
                data.results[0];


            let locationName =
                location.name;


            if (location.country) {

                locationName +=
                    ", " +
                    location.country;

            }


            await getWeather(
                location.latitude,
                location.longitude,
                locationName
            );

        }

        catch (error) {

            console.error(error);

            showError(
                "Could not find this location."
            );

        }

    }


    // --------------------------------
    // Current User Location
    // --------------------------------

    function getCurrentLocation() {

        if (!navigator.geolocation) {

            showError(
                "Your browser does not support location services."
            );

            return;

        }


        showLoading();


        navigator.geolocation.getCurrentPosition(

            // SUCCESS

            async function(position) {

                const latitude =
                    position.coords.latitude;

                const longitude =
                    position.coords.longitude;


                await getWeather(
                    latitude,
                    longitude,
                    "Your Current Location"
                );

            },


            // ERROR

            function(error) {

                console.error(error);

                showError(
                    "Location permission was denied. Please search for a city instead."
                );

            }

        );

    }


    // --------------------------------
    // Press Enter to Search
    // --------------------------------

    document
        .getElementById("cityInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    searchWeather();

                }

            }
        );


    // --------------------------------
    // Load user's location initially
    // --------------------------------

    window.addEventListener(
        "load",
        function() {

            getCurrentLocation();

        }
    );

</script>

</body>
